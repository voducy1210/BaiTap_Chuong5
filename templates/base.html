<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nhà sách Sông Hương{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4" style="background-color: #0d3b66;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('books_list') }}">
                <i class="bi bi-book-half me-2"></i>Nhà sách Sông Hương
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a class="nav-link text-white fw-semibold" href="{{ url_for('books_list') }}">Sách</a>
                <a class="nav-link text-white fw-semibold position-relative pe-3" href="{{ url_for('cart_view') }}">
                    <i class="bi bi-cart3 me-1"></i>Giỏ hàng
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill" style="background-color: #f95738;">
                        {{ cart_count }}
                    </span>
                </a>
                <a class="btn btn-outline-light btn-sm ms-2" href="{{ url_for('admin_dashboard') }}">Quản trị</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
